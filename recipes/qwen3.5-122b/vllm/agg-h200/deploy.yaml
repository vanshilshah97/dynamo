#
# Qwen3.5-122B-A10B-FP8 — aggregated, 1x H200 per worker (TP1), agentic workload.
#
# The FP8 checkpoint of the 122B-A10B (10B active) hybrid MoE fits a single
# 143 GB H200 at the full 262,144-token context, so the throughput-optimal
# layout is TP1 with one GPU per worker: measured 264 output tok/s/GPU at the
# agentic SLA (>= 50 tok/s/user, 64k/400 trace), and every multi-GPU engine
# layout (TP2/TP4/TP8, DP+EP) delivered less per GPU.
#
# Scale out by raising the worker `replicas` behind the KV-aware router
# (DYN_ROUTER_MODE=kv on the frontend). KV-aware routing is load-bearing here:
# the replicas are independent engines, and the agentic workload carries ~57k
# tokens of shared prefix per request, so the router must send each request to
# the replica that already holds its prefix. `replicas: 2` below is a minimal
# KV-router validation deploy; a full 8x H200 node runs `replicas: 8`.
apiVersion: nvidia.com/v1beta1
kind: DynamoGraphDeployment
metadata:
  name: qwen35-122b-agg-h200
  labels:
    app.kubernetes.io/name: qwen35-122b-agg-h200
    app.kubernetes.io/part-of: dynamo
spec:
  backendFramework: vllm
  components:
    - name: Frontend
      type: frontend
      replicas: 1
      podTemplate:
        spec:
          containers:
            - name: main
              image: nvcr.io/nvstaging/ai-dynamo/vllm-runtime:1.3.0-rc.11
              command:
                - python3
              args:
                - -m
                - dynamo.frontend
                - --trust-remote-code
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: DYN_ROUTER_MODE
                  value: kv
              resources: {}
              startupProbe:
                httpGet:
                  path: /health
                  port: 8000
                periodSeconds: 10
                timeoutSeconds: 60
                failureThreshold: 60

    - name: agg
      type: worker
      replicas: 2
      podTemplate:
        spec:
          affinity:
            nodeAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                nodeSelectorTerms:
                  - matchExpressions:
                      - key: nvidia.com/gpu.product
                        operator: In
                        values:
                          - NVIDIA-H200
          tolerations:
            - key: nvidia.com/gpu
              operator: Equal
              value: "true"
              effect: NoSchedule
          volumes:
            - name: model-cache
              persistentVolumeClaim:
                claimName: model-cache
            - name: dshm
              emptyDir:
                medium: Memory
                sizeLimit: 16Gi
          containers:
            - name: main
              image: nvcr.io/nvstaging/ai-dynamo/vllm-runtime:1.3.0-rc.11
              command:
                - python3
                - -m
                - dynamo.vllm
              args:
                - --model
                - Qwen/Qwen3.5-122B-A10B-FP8
                - --served-model-name
                - Qwen/Qwen3.5-122B-A10B-FP8
                - --trust-remote-code
                - --dyn-tool-call-parser
                - qwen3_coder
                - --dyn-reasoning-parser
                - qwen3
                - --tensor-parallel-size
                - "1"
                # `auto` keeps the KV cache in BF16. Intentional: the FP8
                # checkpoint ships no KV scales, and BF16 KV measured best.
                - --kv-cache-dtype
                - auto
                - --enable-prefix-caching
                - --mamba-ssm-cache-dtype
                - float16
                - --max-model-len
                - "262144"
                # Must stay <= 228: the Mamba/DeltaNet SSM cache is block-
                # allocated at TP1 and the vLLM default (1024) crashes at
                # startup. 128 is the measured sweet spot for this workload.
                - --max-num-seqs
                - "128"
                - --max-num-batched-tokens
                - "16384"
                - --gpu-memory-utilization
                - "0.92"
              env:
                - name: POD_UID
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.uid
                - name: HF_HOME
                  value: /model-cache
                - name: HF_MODULES_CACHE
                  value: /tmp/hf_modules
                - name: TRITON_CACHE_DIR
                  value: /tmp/.triton-cache
                - name: VLLM_CONFIG_ROOT
                  value: /tmp/vllm-config
                - name: VLLM_CACHE_ROOT
                  value: /tmp/vllm-cache
              envFrom:
                - secretRef:
                    name: hf-token-secret
              resources:
                requests:
                  nvidia.com/gpu: "1"
                  memory: "64Gi"
                limits:
                  nvidia.com/gpu: "1"
              securityContext:
                runAsUser: 0
              startupProbe:
                httpGet:
                  path: /live
                  port: 9090
                periodSeconds: 30
                timeoutSeconds: 20
                failureThreshold: 60
              volumeMounts:
                - name: model-cache
                  mountPath: /model-cache
                - name: dshm
                  mountPath: /dev/shm
              workingDir: /workspace/
